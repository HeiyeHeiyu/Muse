name: Build APK Only

# 共存版(Canary)快车道:只编译出 debug APK,跳过全套质检。
# 触发方式: Actions 页手动 Run workflow,或 gh workflow run build-apk-only.yml。
on:
  workflow_dispatch:

# 与原 CI 一致:所有 run 步骤使用 PowerShell 7,避免 bash 解析 Windows 风格脚本报错
defaults:
  run:
    shell: pwsh

concurrency:
  group: muse-apk-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:DEBUG_KEYSTORE_BASE64) { Write-Host 'no DEBUG_KEYSTORE_BASE64 secret set'; exit 1 }
          $dir = Join-Path $HOME '.android'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir 'debug.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:DEBUG_KEYSTORE_BASE64))
          Write-Host "stable debug keystore restored ($((Get-Item $path).Length) bytes)"
      - name: Generate canary signing config
        run: |
          $dir = Join-Path $HOME '.android'
          $path = Join-Path $dir 'debug.keystore'
          Copy-Item $path 'canary.keystore' -Force
          $props = @(
            'storeFile=../canary.keystore',
            'storePassword=android',
            'keyAlias=androiddebugkey',
            'keyPassword=android'
          )
          Set-Content -Path 'keystore.properties' -Value $props -Encoding utf8
          Write-Host 'keystore.properties written for release signing'
      - name: Build release APKs (minified + optimized)
        run: ./gradlew assembleRelease -PversionName=2.5.1 -PversionCode=251
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error