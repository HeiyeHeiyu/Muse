<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 450px; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }

  .banner {
    position: relative;
    width: 1200px;
    height: 450px;
    overflow: hidden;
    background: linear-gradient(135deg, #FBF9F3 0%, #F6F2E8 52%, #EFECDF 100%);
  }

  /* 右上角墨绿柔光 */
  .glow {
    position: absolute;
    width: 760px; height: 760px;
    right: -180px; top: -300px;
    background: radial-gradient(closest-side, rgba(84, 128, 96, 0.18), rgba(84, 128, 96, 0.06) 55%, transparent 100%);
    border-radius: 50%;
  }

  /* 左下点阵，向上淡出 */
  .dots {
    position: absolute;
    left: 0; bottom: 0;
    width: 620px; height: 300px;
    background-image: radial-gradient(#C7CFBD 1.3px, transparent 1.4px);
    background-size: 26px 26px;
    opacity: 0.5;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 92%);
            mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent 92%);
  }

  /* 大叶片水印 */
  .leaf-watermark {
    position: absolute;
    right: 30px; bottom: -90px;
    width: 420px;
    mix-blend-mode: multiply;
    opacity: 0.08;
    transform: rotate(-18deg);
  }

  /* ── 左侧文案区 ── */
  .content {
    position: absolute;
    left: 84px; top: 126px;
    width: 640px;
  }

  .logorow { display: flex; align-items: center; gap: 22px; }
  .logorow img {
    width: 96px; height: 96px;
    mix-blend-mode: multiply;      /* 去掉 logo 白底 */
  }
  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 86px;
    line-height: 1;
    color: #29452F;
    letter-spacing: 1px;
  }

  .tagline {
    margin-top: 36px;
    font-size: 40px;
    font-weight: 600;
    color: #35443A;
    letter-spacing: 0.5px;
  }

  /* ── 右侧手机 ── */
  .phones { position: absolute; right: 62px; top: 30px; height: 450px; width: 560px; }

  .phone {
    position: absolute;
    border-radius: 30px;
    border: 7px solid #FDFCF8;
    box-shadow: 0 26px 60px rgba(38, 58, 44, 0.30), 0 6px 16px rgba(38, 58, 44, 0.16);
    overflow: hidden;
    background: #fff;
  }
  .phone img { display: block; width: 100%; }

  .phone-back {
    width: 168px;
    right: 218px; top: 66px;
    transform: rotate(5deg);
    opacity: 0.96;
  }
  .phone-front {
    width: 188px;
    right: 58px; top: 22px;
    transform: rotate(-3.5deg);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>
    <div class="dots"></div>
    <img class="leaf-watermark" src="logo.png" alt="">

    <div class="content">
      <div class="logorow">
        <img src="logo.png" alt="Muse">
        <div class="wordmark">Muse</div>
      </div>
      <div class="tagline">不只是对话，是持续认识你的 AI</div>
    </div>

    <div class="phones">
      <div class="phone phone-back">
        <img src="phone-memory.jpg" alt="记忆">
      </div>
      <div class="phone phone-front">
        <img src="phone-chat.jpg" alt="对话">
      </div>
    </div>
  </div>
</body>
</html>
